<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EUV scanner</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.iso {
  --eu-light: #c4b5ff;
  --eu-beam: #8f7cff;
  --eu-beam-opacity: 0.16;
  --eu-laser: #ff6b6b;
  --eu-tin: #d9d9d9;
  --eu-plasma: #f4eeff;
  --eu-plasma-rim: #a58bff;
  --eu-exposed: #6f5bd6;
  --eu-exposing: #c4b5ff;
  --eu-glow: #ff8a6b;
  --eu-void: #050505;
}
.iso[data-theme="light"] {
  --eu-light: #4b2fd0;
  --eu-beam: #6a4ff0;
  --eu-beam-opacity: 0.12;
  --eu-laser: #d92b2b;
  --eu-tin: #6b6b6b;
  --eu-plasma: #6a4ff0;
  --eu-plasma-rim: #b9a8ff;
  --eu-exposed: #8b76f2;
  --eu-exposing: #4b2fd0;
  --eu-glow: #e0452b;
  --eu-void: #cfcfcf;
}

.eu-stage { position: relative; outline: none; touch-action: pan-y; }
.eu-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.eu-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eu-beam { fill: var(--eu-beam); fill-opacity: var(--eu-beam-opacity); stroke: none; }
.eu-chief { fill: none; stroke: var(--eu-light); stroke-width: 0.5; stroke-opacity: 0.55; stroke-linejoin: round; }
.eu-pulse { fill: none; stroke: var(--eu-light); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.eu-light { mix-blend-mode: screen; }
.iso[data-theme="light"] .eu-light { mix-blend-mode: multiply; }
.eu-laser { fill: none; stroke: var(--eu-laser); stroke-width: 1.3; stroke-linecap: round; opacity: 0; }
.eu-drop { fill: var(--eu-tin); stroke: none; }
.eu-plasma-halo { fill: url(#eu-plasma-grad); opacity: 0; }
.eu-st0 { stop-color: var(--eu-plasma); stop-opacity: 0.95; }
.eu-st1 { stop-color: var(--eu-plasma-rim); stop-opacity: 0.45; }
.eu-st2 { stop-color: var(--eu-plasma-rim); stop-opacity: 0; }
.eu-plasma-core { fill: var(--eu-plasma); opacity: 0; }
.eu-if { fill: var(--eu-light); opacity: 0.6; }
.eu-glow-slot { fill: var(--eu-glow); fill-opacity: 0.12; stroke: var(--anatomy-lo); stroke-width: 0.5; }
.eu-field { fill: var(--eu-exposed); fill-opacity: 0; stroke: var(--anatomy-faint); stroke-width: 0.3; }
.eu-field[data-done] { fill-opacity: 0.45; }
.eu-field[data-now] { fill: var(--eu-exposing); fill-opacity: 0.7; }
.eu-field[data-measured] { fill: var(--anatomy-mid); fill-opacity: 0.25; }
.eu-slit { fill: var(--eu-light); opacity: 0.9; }

.eu-stage[data-focus] .it:not([data-on]) { --anatomy-hi: var(--anatomy-mid); --anatomy-mid: var(--anatomy-lo); }
.it[data-on] { --anatomy-hi: var(--anatomy-lit); --anatomy-mid: var(--anatomy-hi); }
.it[data-on] .iso-top, .it[data-on] .tb-shine { fill: var(--anatomy-lit-top); }
.it[data-on] .iso-shade, .it[data-on] .tb-body { fill: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-shade { stroke: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-top { stroke: var(--anatomy-lit-top); }

.eu-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px 18px; }
.eu-list button { all: unset; cursor: pointer; display: block; width: 100%; padding: 4px 6px; border-radius: 4px; color: var(--anatomy-text); font-size: 12.5px; line-height: 1.35; }
.eu-list button:hover, .eu-list button[data-on] { color: var(--anatomy-strong); background: color-mix(in srgb, var(--anatomy-strong) 7%, transparent); }
.eu-list button:focus-visible { outline: 1px solid var(--anatomy-muted); }
.eu-n { font-variant-numeric: tabular-nums; color: var(--anatomy-muted); margin-right: 4px; }
.eu-note { display: block; color: var(--anatomy-muted); font-size: 11.5px; padding-left: 22px; }

ta-pick="illum"><span class="eu-n">05</span> Illuminator<span class="eu-note">facet mirrors shape the slit</span></button></li><li><button type="button" data-pick="reticle"><span class="eu-n">06</span> Reticle stage<span class="eu-note">mask face down, scans at 1.57 m/s</span></button></li><li><button type="button" data-pick="po"><span class="eu-n">07</span> Projection optics<span class="eu-note">six mirrors, 4:1, NA 0.33</span></button></li><li><button type="button" data-pick="stages"><span class="eu-n">08</span> Wafer stages<span class="eu-note">two chucks, 0.39 m/s scans</span></button></li><li><button type="button" data-pick="metro"><span class="eu-n">09</span> Metrology<span class="eu-note">height map and marks of the next wafer</span></button></li><li><button type="button" data-pick="vac"><span class="eu-n">10</span> Vacuum and hydrogen<span class="eu-note">pumps, and H2 that sweeps tin off the mirrors</span></button></li><li><button type="button" data-pick="handler"><span class="eu-n">11</span> Handlers<span class="eu-note">wafer robot, load lock, reticle library</span></button></li></ol></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>13.5 nm light: collector to wafer, eleven mirrors after the plasma</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>CO2 drive laser pulse, 10.6 µm</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Twin wafer chucks: one exposes, one is measured</span></span><span class="iso-caption">Tin droplets about 27 µm across leave the generator at about 70 m/s, 50,000 a second. A weak pre-pulse flattens each one into a disc; about 2 µs later the main CO2 pulse (10.6 µm, 0.4 J) turns it into a plasma that glows at 13.5 nm (91.8 eV photons). The collector focuses about 250 W to the intermediate focus. Air and glass both absorb this light, so everything runs in vacuum with a little hydrogen, and every optic is a mirror coated with about 40 molybdenum and silicon layer pairs, each reflecting about 67%. After 11 more reflections about 3.1 W reaches the wafer. The mask is lit 6° off normal, and the projection mirrors shrink its pattern 4:1, so the reticle stage scans four times as fast as the wafer stage and in the opposite direction. To give the resist 30 mJ/cm² through a 26 mm slit, the wafer moves at about 0.39 m/s and the reticle at about 1.57 m/s; one 26 × 33 mm field takes 84 ms and about 4,200 pulses. Motion is slowed: the source about 100,000 times, the stages about 8 times. Droplets are drawn far larger than they are.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);
function convexHull(points) {
    const sorted = [...points].sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (sorted.length < 3)
        return sorted;
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [];
    for (const point of sorted) {

const fieldEls = (id) => [...stage.querySelectorAll(`[data-fields="${id}"] .eu-field`)];
const fields = { a: fieldEls("a"), b: fieldEls("b") };
const slit = $("[data-part=slit]");
const pulseLengths = pulses.map((p) => p.getTotalLength());
const pulseStarts = pulseLengths.map((_, i) => pulseLengths.slice(0, i).reduce((a, b) => a + b, 0));
const pulseTotal = pulseLengths.reduce((a, b) => a + b, 0);
pulses.forEach((p, i) => { p.style.strokeDasharray = `26 ${pulseLengths[i] + 60}`; });

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const burst = (age, rise, fall) => (age <= 0 ? 0 : smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall));
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);

const SYSTEMS = ["laser", "tin", "source", "if", "illum", "reticle", "po", "stages", "metro", "vac", "handler"];
const items = Object.fromEntries(SYSTEMS.map((id) => [id, [...stage.querySelectorAll(`.it[data-sys="${id}"]`)]]));
const buttons = [...document.querySelectorAll("[data-pick]")];

// ------------------------------------------------------------------ stage plan: serpentine fields, then a swap
const FIELD_COUNT = DATA.fields.length;
const PER_FIELD = SCAN + STEP;
const WAFER_TIME = FIELD_COUNT * PER_FIELD;
const CYCLE_TIME = WAFER_TIME + SWAP;
const mmU = DATA.wafer.mm;
const half = (FIELD_MM.scan / 2) * mmU;

function exposeAt(t) {
  // Offsets of the exposing chuck (world units) and the reticle, at time t within one wafer.
  const i = Math.min(FIELD_COUNT - 1, Math.floor(t / PER_FIELD));
  const local = t - i * PER_FIELD;
  const f = DATA.fields[i];
  const dir = i % 2 ? -1 : 1;
  const centre = [-f.cx * mmU, -f.cy * mmU];
  if (local < SCAN) {
    const s = local / SCAN; // constant speed under the slit
    const x = centre[0] + dir * half - 2 * dir * half * s;
    return { i, scanning: true, s, x, y: centre[1], ret: -4 * (x - centre[0]) };
  }
  const n = Math.min(FIELD_COUNT - 1, i + 1);
  const g = DATA.fields[n];
  const ndir = n % 2 ? -1 : 1;
  const from = [centre[0] - dir * half, centre[1]];
  const to = [-g.cx * mmU + ndir * half, -g.cy * mmU];
  const e = ease((local - SCAN) / STEP);
  return { i, scanning: false, s: 1, x: from[0] + (to[0] - from[0]) * e, y: from[1] + (to[1] - from[1]) * e, ret: 4 * dir * half };
}
function measureAt(t) {
  // The measuring chuck rasters its wafer under the level sensor in the same time.
  const rows = 9;
  const u = Math.min(1, t / WAFER_TIME) * rows;
  const row = Math.min(rows - 1, Math.floor(u));
  const s = u - row;
  const span = 26;
  const x = (row % 2 ? 1 : -1) * span * (1 - 2 * ease(s));
  const y = -26 + (52 * (row + ease(Math.max(0, s - 0.85) / 0.15))) / rows;
  return { x, y, frac: Math.min(1, t / WAFER_TIME) };
}

// ------------------------------------------------------------------ selection and tour
let picked = null;
let touring = true;
let quietTimer = 0;
function pick(id, { fromUser = false } = {}) {
  if (picked === id) return;
  if (picked) for (const el of items[picked]) el.removeAttribute("data-on");
  picked = id;
  if (id) {
    for (const el of items[id]) el.setAttribute("data-on", "");
    stage.setAttribute("data-focus", id);
  } else stage.removeAttribute("data-focus");
  for (const b of buttons) b.toggleAttribute("data-on", b.dataset.pick === id);
  if (fromUser && id) status.textContent = NAMES[id];
}
const NAMES = {
  laser: "Drive laser", tin: "Tin droplets", source: "Source and collector", if: "Intermediate focus", illum: "Illuminator",
  reticle: "Reticle stage", po: "Projection optics", stages: "Wafer stages", metro: "Metrology", vac: "Vacuum and hydrogen", handler: "Handlers",
};
function hold() {
  touring = false;
  clearTimeout(quietTimer);
  quietTimer = setTimeout(() => { touring = true; tourClock = 0; }, 3600);
}
stage.addEventListener("pointerover", (e) => {
  const it = e.target.closest(".it[data-sys]");
  const id = it && SYSTEMS.includes(it.dataset.sys) ? it.dataset.sys : null;
  if (id) { hold(); pick(id, { fromUser: true }); }
});
stage.addEventListener("pointerleave", () => { hold(); });
for (const b of buttons) {
  b.addEventListener("pointerenter", () => { hold(); pick(b.dataset.pick, { fromUser: true }); });
  b.addEventListener("focus", () => { hold(); pick(b.dataset.pick, { fromUser: true }); });
  b.addEventListener("click", () => { hold(); pick(b.dataset.pick, { fromUser: true }); });
}
let paused = false;
stage.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    const i = picked ? SYSTEMS.indexOf(picked) : -1;
    const n = (i + (e.key === "ArrowRight" ? 1 : SYSTEMS.length - 1) + (i < 0 && e.key === "ArrowLeft" ? 1 : 0)) % SYSTEMS.length;
    hold();
    pick(SYSTEMS[n], { fromUser: true });
    e.preventDefault();
  } else if (e.key === " ") {
    paused = !paused;
    status.textContent = paused ? "paused" : "running";
    hold();
    if (!paused) run();
    e.preventDefault();
  } else if (e.key === "Escape") {
    hold();
    pick(null);
  }
});
stage.addEventListener("focus", () => { status.textContent = picked ? NAMES[picked] : "running"; });

// ------------------------------------------------------------------ the frame
let clock = 0;
let srcClock = 0;
let tourClock = 0;
const TOUR_STEP = 4.5;
const fmt1 = (v, d = 0) => fmt(v, d);

function readoutFor(id, src, exp, meas, field, swapping) {
  const phase = src.phase < CYCLE.main ? (src.phase < 0.02 ? "pre-pulse" : "disc forming") : src.phase < CYCLE.main + 0.06 ? "main pulse · plasma" : "next droplet";
  const scan = swapping ? "chucks swapping" : `field ${field} of ${FIELD_COUNT}`;
  switch (id) {
    case "laser": return `CO2 ${CO2_UM} µm · ${fmt1(PULSE_J, 1)} J a pulse · ${LASER_KW} kW`;
    case "tin": return `droplet ${DROPLET_UM} µm · ${fmt1(SPACING_MM, 1)} mm apart · ${DROPLET_MS} m/s`;
    case "source": return `${phase} · ${fmt1(EUV_MJ)} mJ of 13.5 nm per pulse`;
    case "if": return `${P_IF} W of 13.5 nm at the focus`;
    case "illum": return `${ILLUMINATOR.length} mirrors · ${fmt1(P_RETICLE)} W reaches the mask`;
    case "reticle": return `reticle ${exp.dirSign > 0 ? "→" : "←"} ${fmt1(RETICLE_SPEED, 2)} m/s · 4× the wafer`;
    case "po": return `6 mirrors · 4:1 · NA ${NA} · ${fmt1(P_WAFER, 1)} W on the wafer`;
    case "stages": return `${scan} · wafer ${exp.dirSign > 0 ? "←" : "→"} ${fmt1(WAFER_SPEED, 2)} m/s`;
    case "metro": return `next wafer · height map ${Math.round(meas.frac * 100)}%`;
    case "vac": return "vacuum · a few Pa of H2 keeps tin off the optics";
    case "handler": return `${WPH} wafers an hour · one every ${fmt1(3600 / WPH, 1)} s`;
    default: return `${scan} · ${phase}`;
  }
}

let last = 0;
let frame = 0;
let visible = false;
function tick(now) {
  const real = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const dt = paused || calm ? 0 : real;
  clock += dt;
  srcClock += dt;
  if (touring && !calm) {
    tourClock += real;
    const n = Math.floor(tourClock / TOUR_STEP) % (SYSTEMS.length + 1);
    pick(n < SYSTEMS.length ? SYSTEMS[n] : null);
  }

  // source: droplets march in; the one at the focus is flattened, then flashed to plasma
  const cycles = calm ? 0.35 : srcClock / SRC_PERIOD;
  const phase = cycles - Math.floor(cycles);
  const SP = 10;
  drops.forEach((el, i) => {
    const age = phase + i; // droplets waiting upstream
    let y = DATA.drop.y + (phase - i) * SP;
    if (i === 0 && phase > 0) y = DATA.drop.y; // the one being hit stays at the focus
    let rx = 1.1, ry = 1.1, op = 1;
    if (i === 0) {
      const g = smooth(0, CYCLE.main, phase);
      rx = 1.1 + 2.6 * g;
      ry = 1.1 - 0.75 * g;
      op = phase < CYCLE.main ? 1 : 0;
    }
    if (y < DATA.drop.y0) op = 0;
    const [sx, sy] = iso([DATA.drop.x, y, DATA.drop.z], P);
    el.setAttribute("cx", sx.toFixed(2));
    el.setAttribute("cy", sy.toFixed(2));
    el.setAttribute("rx", (rx * 1.2).toFixed(2));
    el.setAttribute("ry", (ry * 1.2).toFixed(2));
    el.setAttribute("opacity", op);
  });
  const ageSec = phase * SRC_PERIOD;
  const mainAge = (phase - CYCLE.main) * SRC_PERIOD;
  const pre = calm ? 0 : burst(ageSec, 0.04, 0.08) * 0.55;
  const main = calm ? 0 : burst(mainAge, 0.05, 0.12);
  const plasma = calm ? 0 : burst(mainAge - 0.02, 0.06, 0.32);
  laser.style.opacity = Math.max(pre, main).toFixed(3);
  for (const a of amps) a.style.fillOpacity = (0.12 + 0.75 * Math.max(pre, main)).toFixed(3);
  halo.style.opacity = plasma.toFixed(3);
  core.style.opacity = Math.min(1, plasma * 1.4).toFixed(3);
  halo.setAttribute("r", (10 + 14 * plasma).toFixed(2));
  // the 13.5 nm burst runs down the light path
  const travel = calm ? 0 : smooth(0, 1.1, mainAge);
  const pulseOn = calm ? 0 : smooth(0, 0.08, mainAge) * (1 - smooth(0.95, 1.25, mainAge));
  pulses.forEach((p, i) => {
    p.style.opacity = (0.9 * pulseOn).toFixed(3);
    p.style.strokeDashoffset = (pulseStarts[i] - travel * pulseTotal).toFixed(1);
  });
  for (const l of lights) l.style.opacity = (0.7 + 0.3 * plasma).toFixed(3);
  ifGlow.style.opacity = (0.45 + 0.55 * burst(mainAge - 0.08, 0.06, 0.3)).toFixed(3);

  // stages: one wafer of fields, then the chucks trade places
  const t = calm ? WAFER_TIME * 0.45 : clock % CYCLE_TIME;
  const turn = Math.floor((calm ? 0 : clock) / CYCLE_TIME) % 2; // which chuck is under the lens
  const expose = turn ? "b" : "a";
  const measure = turn ? "a" : "b";
  let swapping = false;
  let exp;
  let meas;
  let homeX = { a: 0, b: 0 }; // chuck a rests under the lens, b under the bridge
  const dx = DATA.wafer.meas - DATA.wafer.x;
  if (t < WAFER_TIME) {
    exp = exposeAt(t);
    meas = measureAt(t);
  } else {
    swapping = true;
    exp = exposeAt(WAFER_TIME - 1e-3);
    meas = measureAt(WAFER_TIME);
  }
  exp.dirSign = exp.scanning ? (exp.i % 2 ? -1 : 1) : 0;
  // each chuck is drawn at its home (a under the lens, b under the bridge) and moved to where it is now
  const homeOf = { a: 0, b: dx };
  const place = (id, x, y) => chucks[id].setAttribute("transform", translateAlong(P, [x - homeOf[id], y, 0]));
  if (!swapping) {
    place(expose, exp.x, exp.y);
    place(measure, dx + meas.x, meas.y);
  } else {
    // the exposed wafer leaves for the bridge along the front lane, the measured one comes in behind it
    const s = ease((t - WAFER_TIME) / SWAP);
    const lane = Math.sin(Math.PI * s) * 30;
    place(expose, exp.x + (dx - exp.x) * s, exp.y * (1 - s) + lane);
    place(measure, dx + meas.x - (dx + meas.x) * s, meas.y * (1 - s) - lane);
    if (chucks[expose].parentNode.lastElementChild !== chucks[expose] && chucks[measure].nextElementSibling !== chucks[expose]) chucks[measure].after(chucks[expose]);
  }
  carriage.setAttribute("transform", translateAlong(P, [swapping ? exp.ret : exp.ret, 0, 0]));
  slit.style.opacity = exp.scanning && !swapping ? 1 : 0;

  // fields: done, now, waiting
  const fe = fields[expose];
  const fm = fields[measure];
  for (let i = 0; i < fe.length; i++) {
    const el = fe[i];
    const done = swapping || i < exp.i || (i === exp.i && !exp.scanning);
    el.toggleAttribute("data-done", done);
    el.toggleAttribute("data-now", !swapping && i === exp.i && exp.scanning);
    el.removeAttribute("data-measured");
  }
  for (let i = 0; i < fm.length; i++) {
    const el = fm[i];
    el.removeAttribute("data-done");
    el.removeAttribute("data-now");
    el.toggleAttribute("data-measured", i / fm.length < meas.frac);
  }

  const src = { phase };
  readout.textContent = readoutFor(picked, src, exp, meas, exp.i + 1, swapping);
  frame = visible && !paused && !calm ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener("change", () => { last = 0; frame = 0; run(); });
</script></body></html>
