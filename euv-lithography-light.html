<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EUV scanner</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(900px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso {
  --eu-light: #c4b5ff;
  --eu-beam: #8f7cff;
  --eu-beam-opacity: 0.16;
  --eu-laser: #ff6b6b;
  --eu-tin: #d9d9d9;
  --eu-plasma: #f4eeff;
  --eu-plasma-rim: #a58bff;
  --eu-exposed: #6f5bd6;
  --eu-exposing: #c4b5ff;
  --eu-glow: #ff8a6b;
  --eu-void: #050505;
}
.iso[data-theme="light"] {
  --eu-light: #4b2fd0;
  --eu-beam: #6a4ff0;
  --eu-beam-opacity: 0.12;
  --eu-laser: #d92b2b;
  --eu-tin: #6b6b6b;
  --eu-plasma: #6a4ff0;
  --eu-plasma-rim: #b9a8ff;
  --eu-exposed: #8b76f2;
  --eu-exposing: #4b2fd0;
  --eu-glow: #e0452b;
  --eu-void: #cfcfcf;
}

.eu-stage { position: relative; outline: none; touch-action: pan-y; }
.eu-stage:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 6px; }
.eu-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eu-beam { fill: var(--eu-beam); fill-opacity: var(--eu-beam-opacity); stroke: none; }
.eu-chief { fill: none; stroke: var(--eu-light); stroke-width: 0.5; stroke-opacity: 0.55; stroke-linejoin: round; }
.eu-pulse { fill: none; stroke: var(--eu-light); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.eu-light { mix-blend-mode: screen; }
.iso[data-theme="light"] .eu-light { mix-blend-mode: multiply; }
.eu-laser { fill: none; stroke: var(--eu-laser); stroke-width: 1.3; stroke-linecap: round; opacity: 0; }
.eu-drop { fill: var(--eu-tin); stroke: none; }
.eu-plasma-halo { fill: url(#eu-plasma-grad); opacity: 0; }
.eu-st0 { stop-color: var(--eu-plasma); stop-opacity: 0.95; }
.eu-st1 { stop-color: var(--eu-plasma-rim); stop-opacity: 0.45; }
.eu-st2 { stop-color: var(--eu-plasma-rim); stop-opacity: 0; }
.eu-plasma-core { fill: var(--eu-plasma); opacity: 0; }
.eu-if { fill: var(--eu-light); opacity: 0.6; }
.eu-glow-slot { fill: var(--eu-glow); fill-opacity: 0.12; stroke: var(--anatomy-lo); stroke-width: 0.5; }
.eu-field { fill: var(--eu-exposed); fill-opacity: 0; stroke: var(--anatomy-faint); stroke-width: 0.3; }
.eu-field[data-done] { fill-opacity: 0.45; }
.eu-field[data-now] { fill: var(--eu-exposing); fill-opacity: 0.7; }
.eu-field[data-measured] { fill: var(--anatomy-mid); fill-opacity: 0.25; }
.eu-slit { fill: var(--eu-light); opacity: 0.9; }

.eu-stage[data-focus] .it:not([data-on]) { --anatomy-hi: var(--anatomy-mid); --anatomy-mid: var(--anatomy-lo); }
.it[data-on] { --anatomy-hi: var(--anatomy-lit); --anatomy-mid: var(--anatomy-hi); }
.it[data-on] .iso-top, .it[data-on] .tb-shine { fill: var(--anatomy-lit-top); }
.it[data-on] .iso-shade, .it[data-on] .tb-body { fill: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-shade { stroke: var(--anatomy-lit-shade); }
.it[data-on] [data-seamless] > .iso-top { stroke: var(--anatomy-lit-top); }

.eu-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2px 18px; }
.eu-list button { all: unset; cursor: pointer; display: block; width: 100%; padding: 4px 6px; border-radius: 4px; color: var(--anatomy-text); font-size: 12.5px; line-height: 1.35; }
.eu-list button:hover, .eu-list button[data-on] { color: var(--anatomy-strong); background: color-mix(in srgb, var(--anatomy-strong) 7%, transparent); }
.eu-list button:focus-visible { outline: 1px solid var(--anatomy-muted); }
.eu-n { font-variant-numeric: tabular-nums; color: var(--anatomy-muted); margin-right: 4px; }
.eu-note { display: block; color: var(--anatomy-muted); font-size: 11.5px; padding-left: 22px; }
.eu-ls { stroke-width: 0.5; stroke-opacity: 0.7; }
.eu-controls { margin: 12px 0 0; }
.eu-apart { all: unset; cursor: pointer; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--anatomy-strong); padding: 8px 12px; border: 1px solid var(--anatomy-faint); border-radius: 4px; }
.eu-apart:hover, .eu-apart[data-on] { border-color: var(--anatomy-muted); }
.eu-apart:focus-visible { outline: 1px solid var(--anatomy-muted); outline-offset: 2px; }

an><span class="iso-caption">Tin droplets about 27 µm across leave the generator at about 70 m/s, 50,000 a second. A weak pre-pulse flattens each one into a disc; about 2 µs later the main CO2 pulse (10.6 µm, 0.4 J) turns it into a plasma that glows at 13.5 nm (91.8 eV photons). The collector focuses about 250 W to the intermediate focus. Air and glass both absorb this light, so everything runs in vacuum with a little hydrogen, and every optic is a mirror coated with about 40 molybdenum and silicon layer pairs, each reflecting about 67%. After 11 more reflections about 3.1 W reaches the wafer. While one wafer is exposed, the other chuck carries the next wafer under the metrology bridge, where a level sensor maps its height and an alignment sensor finds its marks; then the two chucks trade places. Masking blades shut the light between fields. The mask is lit 6° off normal, and the projection mirrors shrink its pattern 4:1, so the reticle stage scans four times as fast as the wafer stage and in the opposite direction. To give the resist 30 mJ/cm² through a 26 mm slit, the wafer moves at about 0.39 m/s and the reticle at about 1.57 m/s; one 26 × 33 mm field takes 84 ms and about 4,200 pulses. Motion is slowed: the source about 100,000 times, the stages about 4 times. Droplets are drawn far larger than they are.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

// The EUV scanner model, shared by the build and the live page. Pure numbers, no DOM.
//
// Light: a CO2 laser hits tin droplets, the plasma glows at 13.5 nm, and eleven multilayer mirrors

// delivers the resist's dose with the power that is left.

const PRE_TO_MAIN_US = 2; // the disc grows for a few microseconds before the main pulse
const CO2_UM = 10.6; // main pulse wavelength
const LASER_KW = 20; // average power of the CO2 drive laser
const PULSE_J = (LASER_KW * 1000) / DROPLET_HZ; // 0.4 J per main pulse
const AMPLIFIERS = 4; // seed module, then four CO2 power amplifiers in the subfab

// Power down the light path, with every multilayer mirror reflecting about 67% at 13.5 nm.
const P_IF = 250; // W at the intermediate focus
const EUV_MJ = (P_IF / DROPLET_HZ) * 1000; // 5 mJ of 13.5 nm light per pulse
const R_MIRROR = 0.67;
const LAYERS = 40; // Mo/Si pairs per mirror coating
const PERIOD_NM = 6.9; // thickness of one Mo/Si pair, about half the wavelength
const ILLUMINATOR = ["field facet mirror", "pupil facet mirror", "condenser mirror", "grazing mirror"];
const PROJECTION = ["M1", "M2", "M3", "M4", "M5", "M6"];
const P_RETICLE = P_IF * R_MIRROR ** ILLUMINATOR.length; // about 50 W
const P_WAFER = P_RETICLE * R_MIRROR * R_MIRROR ** PROJECTION.length; // about 3 W
const REFLECTIONS = ILLUMINATOR.length + 1 + PROJECTION.length; // 11 after the collector
const THROUGHPUT = P_WAFER / P_IF; // about 1.2%

// Imaging: 4:1 reduction, NA 0.33, a 26 mm wide slit scanned 33 mm per field.
const MAG = 4;
const NA = 0.33;
const K1 = 0.32;

const FIELD_MM = { slit: 26, scan: 33 };
const RETICLE_FIELD_MM = { slit: FIELD_MM.slit * MAG, scan: FIELD_MM.scan * MAG }; // 104 x 132 mm
const RETICLE_MM = 152; // 6 inch mask blank
const CHIEF_RAY_DEG = 6; // light meets the mask 6 degrees off normal

const EDGE_MM = 3;

  const pulseOn = calm ? 0 : smooth(0, 0.08, mainAge) * (1 - smooth(0.95, 1.25, mainAge));
  pulses.forEach((p, i) => {
    p.style.opacity = (0.9 * pulseOn * power).toFixed(3);
    p.style.strokeDashoffset = (pulseStarts[i] - travel * pulseTotal).toFixed(1);
  });
  for (const l of lights) if (l !== poLight) l.style.opacity = ((0.7 + 0.3 * plasma) * power).toFixed(3);
  ifGlow.style.opacity = ((0.45 + 0.55 * burst(mainAge - 0.08, 0.06, 0.3)) * power).toFixed(3);

  // stages: one wafer of fields, then the chucks trade places
  const t = calm ? WAFER_TIME * 0.45 : clock % CYCLE_TIME;
  const turn = Math.floor((calm ? 0 : clock) / CYCLE_TIME) % 2; // which chuck is under the lens
  const expose = turn ? "b" : "a";
  const measure = turn ? "a" : "b";
  let swapping = false;
  let exp;
  let meas;
  let homeX = { a: 0, b: 0 }; // chuck a rests under the lens, b under the bridge
  const dx = DATA.wafer.meas - DATA.wafer.x;
  if (t < WAFER_TIME) {
    exp = exposeAt(t);
    meas = measureAt(t);
  } else {
    swapping = true;
    exp = exposeAt(WAFER_TIME - 1e-3);
    meas = measureAt(WAFER_TIME);
  }
  exp.dirSign = exp.scanning ? (exp.i % 2 ? -1 : 1) : 0;
  // each chuck is drawn at its home (a under the lens, b under the bridge) and moved to where it is now
  const homeOf = { a: 0, b: dx };
  const place = (id, x, y) => chucks[id].setAttribute("transform", translateAlong(P, [x - homeOf[id], y, 0]));
  if (!swapping) {
    place(expose, exp.x, exp.y);
    place(measure, dx + meas.x, meas.y);
  } else {
    // the exposed wafer leaves for the bridge along the front lane, the measured one comes in behind it
    const s = ease((t - WAFER_TIME) / SWAP);
    const lane = Math.sin(Math.PI * s) * 30;
    place(expose, exp.x + (dx - exp.x) * s, exp.y * (1 - s) + lane);
    place(measure, dx + meas.x - (dx + meas.x) * s, meas.y * (1 - s) - lane);
    if (chucks[expose].parentNode.lastElementChild !== chucks[expose] && chucks[measure].nextElementSibling !== chucks[expose]) chucks[measure].after(chucks[expose]);
  }
  carriage.setAttribute("transform", translateAlong(P, [exp.ret, 0, 0]));
  // masking blades: open for the scan, shut while the stage steps so no light reaches the next field early
  const local = swapping ? STEP : (t % PER_FIELD);
  const shut = swapping ? 1 : 1 - smooth(0, 0.06, local) * (1 - smooth(SCAN - 0.06, SCAN, local));
  rema[0].setAttribute("transform", translateAlong(P, [2.4 * shut, 0, 0]));
  rema[1].setAttribute("transform", translateAlong(P, [-2.4 * shut, 0, 0]));
  poLight.style.opacity = ((0.7 + 0.3 * plasma) * (1 - 0.85 * shut) * power).toFixed(3);
  slit.style.opacity = ((1 - shut) * power).toFixed(3);
  // the level sensor goes dark while the chucks trade places, and lights again on the new wafer
  levelBeams.style.opacity = ((swapping ? 1 - Math.sin(Math.PI * Math.min(1, (t - WAFER_TIME) / SWAP)) : 1) * power).toFixed(3);

  // fields: done, now, waiting
  const fe = fields[expose];
  const fm = fields[measure];
  for (let i = 0; i < fe.length; i++) {
    const el = fe[i];
    const done = swapping || i < exp.i || (i === exp.i && !exp.scanning);
    el.toggleAttribute("data-done", done);
    el.toggleAttribute("data-now", !swapping && i === exp.i && exp.scanning);
    el.removeAttribute("data-measured");
  }
  for (let i = 0; i < fm.length; i++) {
    const el = fm[i];
    el.removeAttribute("data-done");
    el.removeAttribute("data-now");
    el.toggleAttribute("data-measured", i / fm.length < meas.frac);
  }

  const src = { phase };
  const moved = Object.values(pieces).filter((s) => s.x > 0.5).length;
  readout.textContent = moving
    ? apart ? "taking apart" : "closing up · arming"
    : !home ? (picked ? readoutFor(picked, src, exp, meas, exp.i + 1, swapping) + " · stopped" : `apart · ${moved} assemblies off · stopped`)
    : readoutFor(picked, src, exp, meas, exp.i + 1, swapping);
  frame = visible && ((!paused && !calm) || moving) ? requestAnimationFrame(tick) : 0;
}
function run() {
  if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); }
}
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);
still.addEventListener("change", () => { last = 0; frame = 0; run(); });
</script></body></html>
